
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/index.js" defer></script>
  <title>Formulário JS</title>
</head>
<body>
  <header>
    <h1>Formulário super simples</h1>
  </header>

  <main>
    <h2>Cadastro</h2>

    <form id="cadastro" novalidate onsubmit="executar(event)">

      <label for="nome">Nome*</label>
      <input type="text" id="nome">
      <p id="erro-nome" class="oculto"></p>

      <label for="idade">Idade*</label>
      <input type="number" id="idade">
      <p id="erro-idade" class="oculto"></p>

      <label for="celular">Celular*</label>
      <input type="text" id="celular" oninput="mascararCelular(event)">
      <p id="erro-celular" class="oculto"></p>

      <label for="email">Email*</label>
      <input type="email" id="email">
      <p id="erro-email" class="oculto"></p>

      <label for="cpf">CPF*</label>
      <input type="text" id="cpf">
      <p id="erro-cpf" class="oculto"></p>

      <label for="cep">CEP*</label>
      <input type="text" id="cep">
      <p id="erro-cep" class="oculto"></p>

      <label for="endereco">Endereço*</label>
      <input type="text" id="endereco">
      <p id="erro-endereco" class="oculto"></p>

      <label for="numero">Número*</label>
      <input type="number" id="numero">
      <p id="erro-numero" class="oculto"></p>

      <label for="bairro">Bairro*</label>
      <input type="text" id="bairro">
      <p id="erro-bairro" class="oculto"></p>

      <label for="cidade">Cidade*</label>
      <input type="text" id="cidade">
      <p id="erro-cidade" class="oculto"></p>

      <label>
        <input type="checkbox" id="termos">
        Li e aceito os termos
        <p id="erro-termos" class="oculto"></p>
      </label>

      <button type="submit">Enviar</button>
      <p id="concluido" class="oculto"></p>

    </form>
  </main>

  <footer>
    <p>Projeto para conhecermos o JavaScript</p>
  </footer>
</body>
</html>
