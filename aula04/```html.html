```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo Profissional</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .linha {
            display: flex;
            gap: 15px;
        }

        .campo {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Currículo Profissional</h1>

    <form>

        <h2>1. Dados Pessoais</h2>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>

        <div class="linha">
            <div class="campo">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="14" max="100">
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
            </div>
        </div>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco">

        <h2>2. Objetivo Profissional</h2>

        <label for="objetivo">Qual é o seu objetivo profissional?</label>
        <textarea id="objetivo" name="objetivo"
            placeholder="Ex.: Busco uma oportunidade para desenvolver minhas habilidades profissionais..."></textarea>

        <h2>3. Formação Acadêmica</h2>

        <label for="escolaridade">Escolaridade:</label>
        <select id="escolaridade" name="escolaridade">
            <option value="">Selecione</option>
            <option>Ensino Fundamental</option>
            <option>Ensino Médio</option>
            <option>Ensino Técnico</option>
            <option>Ensino Superior</option>
            <option>Pós-graduação</option>
        </select>

        <label for="curso">Curso / Formação:</label>
        <input type="text" id="curso" name="curso">

        <label for="instituicao">Instituição de ensino:</label>
        <input type="text" id="instituicao" name="instituicao">

        <label for="conclusao">Ano de conclusão:</label>
        <input type="number" id="conclusao" name="conclusao" min="1950" max="2100">

        <h2>4. Experiência Profissional</h2>

        <label for="empresa">Nome da empresa:</label>
        <input type="text" id="empresa" name="empresa">

        <label for="cargo">Cargo exercido:</label>
        <input type="text" id="cargo" name="cargo">

        <label for="periodo">Período de trabalho:</label>
        <input type="text" id="periodo" name="periodo"
            placeholder="Ex.: Janeiro de 2023 até Dezembro de 2025">

        <label for="atividades">Principais atividades realizadas:</label>
        <textarea id="atividades" name="atividades"></textarea>

        <h2>5. Habilidades</h2>

        <label for="habilidades">Quais são suas principais habilidades?</label>
        <textarea id="habilidades" name="habilidades"
            placeholder="Ex.: Trabalho em equipe, comunicação, informática, organização..."></textarea>

        <h2>6. Cursos Complementares</h2>

        <label for="cursos">Cursos realizados:</label>
        <textarea id="cursos" name="cursos"
            placeholder="Informe os cursos, instituições e duração."></textarea>

        <h2>7. Informações Adicionais</h2>

        <label for="idiomas">Idiomas:</label>
        <input type="text" id="idiomas" name="idiomas"
            placeholder="Ex.: Inglês básico, Espanhol intermediário">

        <label for="disponibilidade">Disponibilidade:</label>
        <select id="disponibilidade" name="disponibilidade">
            <option value="">Selecione</option>
            <option>Período integral</option>
            <option>Meio período</option>
            <option>Manhã</option>
            <option>Tarde</option>
            <option>Noite</option>
        </select>

        <label for="informacoes">Informações adicionais:</label>
        <textarea id="informacoes" name="informacoes"
            placeholder="Digite outras informações que considere importantes."></textarea>

        <button type="submit">Enviar Currículo</button>

    </form>

</div>

</body>
</html>
```
